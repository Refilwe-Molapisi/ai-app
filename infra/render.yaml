# Render Blueprint — CAIOS backend on the free tier (Layer 2)
# Deploy: Render → New → Blueprint → point at this repo (Render reads this file)
# Reference: docs/12-deployment.md (CAIOS-DEPLOY-001)
#
# Honest limits (Nov 2026): free plan = 750 instance-hrs/month, spins down
# after 15 min idle, ~512 MB RAM. Keep-alive via cron-job.org (blueprint §4.3).
# The worker must share the API's JOB_RUN_SECRET and DATABASE_URL — set them
# to identical values in both services' dashboards after the first deploy.

services:
  # ── The API (this repo's backend image; /health is the Render probe) ────
  - type: web
    name: caios-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    region: frankfurt   # closest to ZA of the free regions; EU also suits EU-hosted Supabase
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CAIOS_ENV
        value: staging        # flip to production after the smoke checklist
      - key: DATABASE_URL
        sync: false           # Supabase *pooler* string (port 6543, sslmode=require)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false           # https://<project>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false           # https://refilwe-molapisi.github.io[,https://<vercel-domain>]
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: EMBEDDING_ENDPOINT
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: JOB_RUN_SECRET
        generateValue: true   # copy the SAME value into the worker + cron-job.org
      - key: JOB_BATCH_SIZE
        value: "5"
      - key: JOB_TIME_BUDGET_SECONDS
        value: "20"           # stay inside cron-job.org's ~30 s HTTP timeout
      - key: JOB_MAX_ATTEMPTS
        value: "3"

  # ── The worker (same image, no port; drains the job queue on a loop) ────
  - type: worker
    name: caios-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerCommand: python -m app.jobs.loop_worker
    plan: free
    region: frankfurt
    envVars:
      - key: CAIOS_ENV
        value: staging
      - key: DATABASE_URL
        sync: false           # SAME value as caios-api
      - key: DEEPSEEK_API_KEY
        sync: false           # steps call the model directly
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: EMBEDDING_ENDPOINT
        sync: false
      - key: JOB_RUN_SECRET
        sync: false           # SAME value as caios-api
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: JOB_TIME_BUDGET_SECONDS
        value: "25"
