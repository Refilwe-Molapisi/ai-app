# Scheduled independent backups of the Supabase database → Cloudflare R2.
# Reference: docs/01-hosting-blueprint.md §4.5 — closes TV-011, feeds TV-020/TV-025.
# Secrets required (repo Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
#   BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY, BACKUP_ENCRYPTION_KEY

name: backup-supabase

on:
  schedule:
    - cron: "0 2 * * *"      # daily 02:00 UTC ≈ 04:00 SAST — inside Supabase off-peak
  workflow_dispatch: {}      # manual run for restore tests (TV-020/TV-025)

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest   # 4 vCPU / 16 GB / 6 h cap — ample for pg_dump
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client age >/dev/null
          curl -sSL https://github.com/s3-oss/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.deb -o /tmp/rclone.deb
          sudo dpkg -i /tmp/rclone.deb >/dev/null

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump "$SUPABASE_DB_URL" --no-owner --format=custom -f "caios-${STAMP}.dump"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Encrypt dump (age, passphrase from secret)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          age -p -o "caios-${STAMP}.dump.age" "caios-${STAMP}.dump" <<< "$BACKUP_ENCRYPTION_KEY" \
            || printf '%s' "$BACKUP_ENCRYPTION_KEY" | age -a -p -o "caios-${STAMP}.dump.age" "caios-${STAMP}.dump"
          rm -f "caios-${STAMP}.dump"

      - name: Upload to R2 (independent of Supabase and Z1)
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          rclone config create r2 s3 \
            provider=Cloudflare \
            endpoint="$BACKUP_S3_ENDPOINT" \
            access_key_id="$BACKUP_S3_ACCESS_KEY" \
            secret_access_key="$BACKUP_S3_SECRET_KEY" >/dev/null
          rclone copy "caios-${STAMP}.dump.age" "r2:${BACKUP_S3_BUCKET}/supabase/daily/"

      - name: Retention — keep last 30 daily backups
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          rclone config create r2 s3 \
            provider=Cloudflare \
            endpoint="$BACKUP_S3_ENDPOINT" \
            access_key_id="$BACKUP_S3_ACCESS_KEY" \
            secret_access_key="$BACKUP_S3_SECRET_KEY" >/dev/null
          rclone lsf "r2:${BACKUP_S3_BUCKET}/supabase/daily/" | sort | head -n -30 \
            | while read -r old; do
                [ -n "$old" ] && rclone deletefile "r2:${BACKUP_S3_BUCKET}/supabase/daily/$old"
              done

      - name: Restore-test hook (run manually for TV-020/TV-025 evidence)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Restore procedure: decrypt (age -d), pg_restore into scratch Postgres,"
          echo "diff row counts against live. See docs/01-hosting-blueprint.md §8 step 7."
